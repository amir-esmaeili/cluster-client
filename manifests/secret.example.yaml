apiVersion: v1
kind: Secret
metadata:
  name: cluster-client-secret
  namespace: default
type: Opaque
stringData:
  # Placeholder for future authentication token between client and cluster nodes.
  # The current API specification does not require authentication, but this
  # Secret is included for extensibility.
  #
  # To use this secret, uncomment the env section in job.yaml and populate
  # the api-token value below with your actual token.
  #
  # Example usage in job.yaml:
  #   env:
  #     - name: API_TOKEN
  #       valueFrom:
  #         secretKeyRef:
  #           name: cluster-client-secret
  #           key: api-token
  api-token: "REPLACE_WITH_ACTUAL_TOKEN"
